name: InternHub Daily Ingest

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ingest script
        env:
          INTERNHUB_FUNCTION_URL: ${{ secrets.INTERNHUB_FUNCTION_URL }}
          INTERNHUB_INGEST_KEY: ${{ secrets.INTERNHUB_INGEST_KEY }}
        run: node scripts/sendToFunction.js
