name: Scrape & Ingest Opportunities

  push:
    branches: [web]
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *" # daily 01:15 UTC

jobs:
  scrape_and_ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run scraper + send to Supabase function
        env:
          INTERNHUB_FUNCTION_URL: ${{ secrets.INTERNHUB_FUNCTION_URL }}
          INTERNHUB_INGEST_KEY: ${{ secrets.INTERNHUB_INGEST_KEY }}
        run: node scripts/sendToFunction.js
